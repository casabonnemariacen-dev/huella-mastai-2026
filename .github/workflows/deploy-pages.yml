# Publica la app en GitHub Pages con cada push a main (o a mano desde la
# pestaña Actions). Corre las pruebas antes de compilar: si fallan, no publica.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Opcional: servidor de rutas propio (ver README). Se define en
          # Settings → Secrets and variables → Actions → Variables.
          VITE_URL_RUTAS: ${{ vars.VITE_URL_RUTAS }}
          # Guardado anónimo en Supabase (ver supabase/README.md). Clave PÚBLICA.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_CLAVE_PUBLICA: ${{ vars.VITE_SUPABASE_CLAVE_PUBLICA }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
